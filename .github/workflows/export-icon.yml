name: Export README icon

# Renders Resources/AppIcon.icon to docs/icon.png and commits it back to the branch.
on:
  push:
    branches-ignore: [main]
    paths:
      - 'Resources/AppIcon.icon/**'
      - '.github/workflows/export-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    name: Export docs/icon.png
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v7
      - name: Build the app
        run: |
          set -o pipefail
          xcodebuild build \
            -project Grab.xcodeproj \
            -scheme Grab \
            -configuration Debug \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO
      - name: Render the icon
        run: |
          ICNS=build/DerivedData/Build/Products/Debug/Grab.app/Contents/Resources/AppIcon.icns
          if [[ -f "$ICNS" ]]; then
            # The icon as Xcode compiles it, with the system margin and shadow.
            sips -s format png -z 512 512 "$ICNS" --out docs/icon.png
          else
            echo "No AppIcon.icns in the build, falling back to ictool"
            ICTOOL="$(xcode-select -p)/Applications/Icon Composer.app/Contents/Executables/ictool"
            "$ICTOOL" Resources/AppIcon.icon --export-preview macOS Light 412 412 1 build/icon.png
            sips --padToHeightWidth 512 512 build/icon.png --out docs/icon.png
          fi
          sips -g pixelWidth -g pixelHeight docs/icon.png
      - uses: actions/upload-artifact@v7
        with:
          name: icon
          path: docs/icon.png
      - name: Commit if changed
        run: |
          if git diff --quiet -- docs/icon.png; then
            echo "docs/icon.png is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Export docs/icon.png from AppIcon.icon" -- docs/icon.png
          git push
